[project]
name = "seqchat"
version = "0.1.0"
description = "A small, evidence-first natural-language analytics prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.4.0,<2",
  "fastapi>=0.116,<1",
  "httpx[socks]>=0.28,<1",
  "langgraph>=0.6,<2",
  "pydantic-settings>=2.10,<3",
  "sqlglot>=27,<30",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
seqchat-init-data = "seqchat.data:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seqchat"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["seqchat"]

[[tool.mypy.overrides]]
module = ["duckdb.*"]
ignore_missing_imports = true
